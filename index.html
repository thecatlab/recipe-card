<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe builder</title>
<link rel="icon" href="data:,">
<style>
:root{
  --paper:#FFFFFF;
  --card:#FFFFFF;
  --ink:#1B221C;
  --ink-soft:#5A6459;
  --rule:#111111;
  --control-h:38px;
  --turmeric:#185765;
  --turmeric-wash:#E8F0E5;
  --kale:#3F5F44;
  --kale-wash:#D9E8D5;
  --decision-wash:#ECF4EA;
  --pepper:#2A2622;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Instrument Sans",system-ui,sans-serif;
  font-size:16px;
  line-height:1.6;
  padding:clamp(20px,4vw,56px) clamp(16px,4vw,40px) 72px;
}
.wrap{max-width:1080px;margin:0 auto}

.eyebrow{
  font-family:"Space Mono",monospace;
  font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--turmeric);margin:0 0 14px;
}
h1{
  font-family:"Bricolage Grotesque","Instrument Sans",sans-serif;
  font-weight:800;font-size:clamp(44px,9vw,88px);
  letter-spacing:-.045em;line-height:.88;margin:0;
}
h1 .tm{font-size:.28em;vertical-align:super;letter-spacing:0;font-weight:600}
.deck{
  font-family:"Bricolage Grotesque",sans-serif;font-weight:400;
  font-size:clamp(17px,2.4vw,22px);line-height:1.35;
  max-width:32ch;margin:18px 0 0;color:var(--ink-soft);
}
.meta{
  display:flex;flex-wrap:wrap;gap:0 28px;
  font-family:"Space Mono",monospace;font-size:12px;letter-spacing:.04em;
  color:var(--ink-soft);margin:26px 0 0;
  border-top:1.5px solid var(--rule);padding-top:12px;
}
.meta b{color:var(--ink);font-weight:700}

.controls{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;
  margin:0 0 22px;
}
.group{display:flex;align-items:center;gap:8px}
.group>span{
  font-family:"Space Mono",monospace;font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);
}
button{
  font-family:"Space Mono",monospace;font-size:13px;
  background:transparent;color:var(--ink);
  border:1.5px solid var(--rule);border-radius:0;
  display:inline-flex;align-items:center;justify-content:center;
  min-height:var(--control-h);padding:0 16px;cursor:pointer;line-height:1.2;
  transition:background .12s ease,color .12s ease;
}
button:hover{background:var(--kale-wash)}
button:focus-visible{outline:2.5px solid var(--turmeric);outline-offset:2px}
button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.go{margin-left:auto;background:var(--turmeric);border-color:var(--turmeric);color:#fff;font-weight:700}
.go:hover{background:var(--pepper);border-color:var(--pepper)}

.stage-bar{
  display:none;align-items:center;gap:16px;flex-wrap:wrap;
  border:1.5px solid var(--rule);background:var(--turmeric-wash);
  padding:12px 16px;margin:0 0 18px;
}
.stage-bar.live{display:flex}
.stage-n{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--pepper)}
.stage-t{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:19px;letter-spacing:-.02em}
.clock{
  font-family:"Space Mono",monospace;font-weight:700;font-size:22px;
  margin-left:auto;font-variant-numeric:tabular-nums;
}
.clock.ring{background:var(--ink);color:var(--turmeric-wash);padding:0 8px}

.scroll{overflow-x:auto;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:940px;table-layout:fixed;border:1px solid var(--rule)}
col.c0{width:34%}col.c1{width:11%}col.c2{width:11%}col.c3{width:14%}col.c4{width:14%}col.c5{width:9%}col.c6{width:7%}
th.item-title{
  border:1px solid var(--rule);background:var(--turmeric);color:#fff;
  font-family:"Bricolage Grotesque","Instrument Sans",sans-serif;
  font-size:18px;font-weight:800;line-height:1.2;text-align:center;padding:7px 12px;
}
td{
  border:1px solid var(--rule);
  padding:10px 12px;vertical-align:middle;
  transition:background .15s ease,opacity .15s ease;
}
td.prep{
  text-align:center;background:var(--kale-wash);color:var(--ink);
  font-family:"Instrument Sans",system-ui,sans-serif;font-size:17px;
  font-weight:500;letter-spacing:0;text-transform:none;padding:9px 12px;
}
td.ing{
  --measure-col:88px;
  background:#fff;font-size:16px;line-height:1.2;cursor:pointer;
  padding:10px 14px;
}
.ingredient-line,.detail-line{
  display:grid;grid-template-columns:var(--measure-col) minmax(0,1fr);
  column-gap:10px;align-items:baseline;
}
td.ing .q{
  font-family:"Instrument Sans",system-ui,sans-serif;
  font-weight:700;font-size:16px;text-align:right;white-space:nowrap;
}
td.ing .name{font-size:16px}
td.ing .detail-line{
  margin-top:2px;font-size:11.5px;line-height:1.25;font-style:italic;color:var(--ink);
}
td.ing .secondary-q{font-weight:600;text-align:right;white-space:nowrap}
td.ing .note{font-size:11.5px}
td.ing.off{opacity:.38;text-decoration:line-through}
td.op{
  text-align:center;font-size:14px;line-height:1.25;
  background:var(--kale-wash);cursor:pointer;
  padding:12px 8px;
}
td.op b{
  display:block;font-family:"Instrument Sans",system-ui,sans-serif;
  font-weight:700;font-size:16.5px;line-height:1.15;letter-spacing:-.01em;
}
td.op span{
  display:block;margin-top:4px;font-family:"Instrument Sans",system-ui,sans-serif;
  font-size:13px;line-height:1.25;color:var(--ink);letter-spacing:0;
}
td.finish{
  background:var(--kale-wash);color:var(--ink);text-align:center;
  font-family:"Instrument Sans",system-ui,sans-serif;font-size:16px;padding:9px 12px;
}
td.finish b{font-weight:700}
td.decision{padding:0;background:var(--decision-wash)}
ul.bullets,ol.bullets{width:fit-content;max-width:calc(100% - 12px);margin:2px auto;padding-left:1.1em;text-align:left}ol.bullets{padding-left:1.4em}ul.bullets li,ol.bullets li{margin:0;padding-left:0;overflow-wrap:anywhere}
.entry-grid textarea.has-bullets[data-field]{text-align:left}
.bullets.spaced,.rich-text.spaced{margin-top:1.25em}
.has-tools{position:relative}
.has-tools .tools,.has-tools .tools-space{display:block;font-size:11.5px;line-height:1.25;font-style:italic;font-weight:400;text-align:center;overflow-wrap:anywhere}
.has-tools .tools-space{visibility:hidden;margin:4px 0}
.has-tools .tools-space:first-child{margin-top:0}.has-tools .tools-space:nth-last-child(2){margin-bottom:0}
.has-tools .tools{position:absolute;left:12px;right:12px;bottom:9px;color:var(--ink)}
td.op.has-tools .tools{left:8px;right:8px;bottom:12px}
td.op.hot .tools{color:var(--turmeric-wash)}
.entry-grid input[data-field=tools][data-kind]{font-size:11.5px;font-style:italic;font-weight:400;text-align:center;min-height:26px;color:var(--ink)}
.instruction-row input[data-field=tools]{grid-column:2}
td.decision .decision-q{padding:9px 12px;font-weight:600}
td.decision .decision-q .decision-tag{font-weight:400}
.answer-pill{display:inline-block;font:11px/1.5 'Space Mono',monospace;border:1px solid var(--rule);border-radius:99px;padding:0 8px;margin-bottom:4px;background:#fff;color:var(--ink)}
td.decision .branch-item{margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule)}
td.decision .branch-item:not(.branch-decision)>b{display:inline;margin:0}
td.decision .branch-item.branch-decision{border:1px solid var(--rule);padding:0;background:var(--decision-wash)}
td.decision .decision-options>div{padding:9px 12px}
td.decision .decision-options b{display:block;margin-bottom:2px}
td.op.hot{background:var(--turmeric);color:#fff}
td.op.hot span{color:var(--turmeric-wash)}
tr.hot td.ing{background:var(--turmeric-wash)}
.dim td.op,.dim td.ing{opacity:.3}
.dim td.op.hot,.dim tr.hot td.ing{opacity:1}

.notes{margin-top:48px;border-top:1.5px solid var(--rule);padding-top:26px}
.notes h2{
  font-family:"Space Mono",monospace;font-size:11px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--turmeric);margin:0 0 18px;
}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px 34px}
.note-item h3{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:16.5px;letter-spacing:-.015em;margin:0 0 4px}
.note-item p{margin:0;font-size:14.5px;line-height:1.55;color:var(--ink-soft)}
.credit{
  margin-top:40px;font-family:"Space Mono",monospace;font-size:11.5px;
  color:var(--ink-soft);letter-spacing:.03em;line-height:1.7;
}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{background:#fff;padding:0}
  .controls,.stage-bar{display:none!important}
  .scroll{overflow:visible}
  td.op{background:#f0f0f0}
}

[hidden]{display:none!important}
.app-top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.app-top h1{font-size:38px;line-height:1.1;letter-spacing:-.04em}
.app-top{align-items:center}
#monochrome-toggle{width:var(--control-h);padding:0}
.icon-button{width:var(--control-h);padding:0}.icon-button svg{width:20px;height:20px;display:block}
#delete-recipe:hover{color:#fff;background:#92372f;border-color:#92372f}
.mono-icon{width:14px;height:14px;border:1.5px solid currentColor;border-radius:50%;background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.monochrome{--ink:#111111;--ink-soft:#555555;--rule:#111111;--turmeric:#111111;--turmeric-wash:#EEEEEE;--kale:#333333;--kale-wash:#E4E4E4;--decision-wash:#F3F3F3;--pepper:#111111;color:var(--ink)}
#editor.monochrome .entry-column-headings th{background:#F4F4F4}
#editor.monochrome .entry-meta{border-top-color:#DDDDDD}
#editor.monochrome .procedure-details{border-top-color:#B4B4B4}
#editor.monochrome input,#editor.monochrome textarea{border-color:#B4B4B4}
#editor.monochrome .entry-grid input,#editor.monochrome .entry-grid textarea{border-color:transparent}
.library-bar,.view-bar,.export-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.library-bar{padding:16px 0;border-top:1.5px solid var(--rule);border-bottom:1.5px solid var(--rule)}
.library-bar label{font:11px 'Space Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
.library-bar select{flex:1;max-width:340px;min-width:150px}
#save-status{margin-left:auto;font-size:12px;color:var(--ink-soft)}
.view-bar{margin:22px 0}.view-bar .export-bar{margin-left:auto}
.text-tool{font-size:20px;line-height:1;padding:0;width:var(--control-h)}
.frac{display:inline-flex;flex-direction:column;align-items:center;font:700 11px/1 'Space Mono',monospace}.frac span{padding:1px 2px}.frac span:first-child{border-bottom:1.5px solid currentColor}
button:disabled{opacity:.4;cursor:default}
select{height:var(--control-h)}
input,textarea,select{font:14px/1.4 'Instrument Sans',system-ui,sans-serif;color:var(--ink);background:#fff;border:1px solid #adb6ab;border-radius:0;padding:8px 10px;max-width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--turmeric);outline-offset:1px}
textarea{resize:vertical;min-height:62px}
input[type=checkbox]{accent-color:var(--turmeric);width:18px;height:18px;flex:none}
body.editing-table .wrap{max-width:1440px}
.entry-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.entry-toolbar h2{font:600 24px/1.2 'Bricolage Grotesque',sans-serif;margin:0}
.entry-toolbar div{display:flex;gap:8px}
.entry-grid{table-layout:fixed;min-width:940px}
.entry-grid input,.entry-grid textarea{width:100%;background:transparent;border:1px solid transparent;padding:5px 6px;min-height:30px;line-height:1.35}
.entry-grid input:hover,.entry-grid textarea:hover{border-color:#aeb9ab}
.entry-grid input:focus,.entry-grid textarea:focus{background:#fff;border-color:var(--turmeric)}
.entry-grid textarea{resize:none;display:block;overflow:hidden}
.entry-grid .item-title input{font:800 22px/1.2 'Bricolage Grotesque',sans-serif;color:#fff;text-align:center}
.entry-grid .item-title input::placeholder{color:#fff;opacity:.8}
.entry-grid .item-title input:focus{color:var(--ink)}
.entry-grid .entry-overview{padding:10px 14px}
.entry-overview input[data-field=eyebrow]{font:11px/1.4 'Space Mono',monospace;color:var(--turmeric)}
.entry-overview textarea[data-field=description]{font-size:16px}
.entry-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:8px;padding-top:8px;border-top:1px solid #dce3d8}
.entry-meta label{display:flex;align-items:center;gap:6px;min-width:0}
.entry-meta span{font-size:11px;color:var(--ink-soft);white-space:nowrap}
.entry-meta input{min-width:0;font-size:12px}
.entry-meta input[data-field=baseServings]{width:64px;flex:none}
.entry-grid .prep,.entry-grid .finish{padding:4px 12px}
.entry-grid .prep textarea,.entry-grid .finish textarea{font-size:14px}
.entry-grid .prep input[data-field=title],.entry-grid .finish input[data-field=title]{font-weight:700;font-size:14px}
.instruction-row{display:grid;grid-template-columns:minmax(120px,220px) minmax(0,1fr) auto;gap:8px;align-items:start}
.instruction-row .row-actions{display:flex;align-items:flex-start;white-space:nowrap;padding-top:3px}
.entry-grid .instruction-add{padding:4px 12px;text-align:center}
.instruction-add button+button{margin-left:8px}
.decision-tag{font:11px 'Space Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
.entry-grid td.decision{padding:0}
.entry-grid .grid-head-row{grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center}
.grid-add{display:flex;gap:8px}
td.grid-title{font-weight:500}
.entry-grid .decision-head{grid-template-columns:auto minmax(0,1fr) auto;padding:4px 12px}
.entry-grid .decision-head textarea{font-weight:600}
.decision-options{display:grid;grid-template-columns:repeat(var(--options),minmax(0,1fr));border-top:1px solid var(--rule)}
.decision-options>div{padding:6px 8px;min-width:0;position:relative}.decision-options>div+div{border-left:1px dashed var(--rule)}
.decision-options>div+div::before{content:'OR';position:absolute;left:0;top:50%;transform:translate(-50%,-50%);z-index:1;font:10px/1 'Space Mono',monospace;letter-spacing:.06em;padding:3px 6px;border:1px solid var(--rule);border-radius:99px;background:#fff;color:var(--ink)}
.entry-grid .decision-options input{font-weight:700;text-align:center}
.entry-grid .decision-options textarea{font-size:13px;text-align:center}
.option-head{display:grid;grid-template-columns:minmax(56px,90px) minmax(0,1fr) auto;gap:6px;align-items:start}
.entry-grid .decision-options input[data-field=answer]{font:11px 'Space Mono',monospace;border:1px solid var(--rule);border-radius:99px;min-height:26px;background:#fff}
.entry-grid .branch-item{margin-top:8px;padding:6px;border:1px dashed var(--rule);background:rgba(255,255,255,.35)}
.branch-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:start}
.branch-decision>.branch-head{grid-template-columns:auto minmax(0,1fr) auto;align-items:center}
.entry-grid .branch-head textarea{font-weight:600}
.branch-add{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.option-head .row-actions{padding-top:3px}
.decision-add{padding-top:6px;border-top:1px solid var(--rule)}
.entry-column-headings th{font:11px/1.3 'Space Mono',monospace;text-align:center;padding:7px 8px;border:1px solid var(--rule);background:#f4f7f2;font-weight:400}
.entry-column-headings th:first-child{text-align:left}
.entry-column-headings .row-actions{margin-top:2px}
.entry-grid .editor-ingredient{padding:8px 10px;vertical-align:top;background:#fff}
.entry-ingredient-grid{display:grid;grid-template-columns:64px 48px minmax(0,1fr) auto;column-gap:4px;align-items:start}
.entry-ingredient-grid input[data-field=quantity]{grid-column:1;grid-row:1;font-size:16px;font-weight:700;text-align:right}
.entry-ingredient-grid input[data-field=unit]{grid-column:2;grid-row:1;padding-left:0;font-size:14px}
.entry-ingredient-grid input[data-field=name]{grid-column:3;grid-row:1;font-size:16px}
.entry-ingredient-grid input[data-field=metricQuantity]{grid-column:1;grid-row:2;text-align:right}
.entry-ingredient-grid input[data-field=metricUnit]{grid-column:2;grid-row:2;padding-left:0}
.entry-grid input[data-field=metricQuantity],.entry-grid input[data-field=metricUnit]{font-size:12px;min-height:26px;color:var(--ink-soft);font-style:italic}
.entry-ingredient-grid .entry-description{grid-column:3 / 5;grid-row:2}
.entry-description textarea{font-size:12px;font-style:italic;min-height:26px}
.entry-ingredient-grid .row-actions{grid-column:4;grid-row:1;display:flex;align-items:flex-start;align-self:start;white-space:nowrap}
.entry-grid summary{cursor:pointer;list-style-position:inside;font-size:10px;line-height:1.5;color:var(--ink-soft);padding:3px 0}
.entry-grid .row-actions button{font-size:10px;padding:3px 4px;min-height:0}
.entry-grid .editor-op{background:var(--kale-wash);padding:10px 8px;vertical-align:top;text-align:center;position:relative}
.op-actions{display:flex;justify-content:flex-end;margin:-6px -4px 2px}
.edge-handle{position:absolute;left:0;right:0;height:12px;z-index:3;cursor:ns-resize;touch-action:none}
.edge-handle.top{top:-6px}.edge-handle.bottom{bottom:-6px}
.edge-handle::after{content:'';position:absolute;left:35%;right:35%;top:4px;height:4px;border-radius:2px;background:var(--ink);opacity:0;transition:opacity .12s ease}
.entry-grid td.editor-op:hover>.edge-handle::after{opacity:.35}.edge-handle:hover::after,body.resizing .edge-handle::after{opacity:.8}
.entry-grid .editor-ingredient{position:relative}
.row-insert{position:absolute;left:0;right:0;height:14px;z-index:4;display:flex;align-items:center;justify-content:center}
.row-insert.top{top:-7px}.row-insert.bottom{bottom:-7px}
.row-insert::before{content:'';position:absolute;left:0;right:0;top:6px;height:2px;background:var(--ink);opacity:0;transition:opacity .12s ease}
.row-insert button{position:relative;width:22px;height:22px;min-height:0;padding:0;font:13px/1 'Space Mono',monospace;color:#fff;background:var(--ink);border:1px solid var(--ink);border-radius:50%;opacity:0;transition:opacity .12s ease}
.row-insert:is(:hover,:focus-within)::before{opacity:.6}.row-insert:is(:hover,:focus-within) button{opacity:1}
@media (hover:none){.row-insert button{opacity:.5}}
.entry-grid td.slot{background:#fff;padding:0;vertical-align:middle;text-align:center}
.entry-grid td.slot.open-left{border-left-style:hidden}.entry-grid td.slot.open-right{border-right-style:hidden}
.slot-add{width:24px;height:24px;min-height:0;padding:0;font:14px/1 'Space Mono',monospace;color:var(--ink);background:#fff;border:1px solid var(--ink)}
.slot-add:hover{color:#fff;background:var(--ink)}
@media (hover:hover) and (pointer:fine){.slot-add{opacity:0;pointer-events:none;transition:opacity .12s ease}.entry-grid td.slot:is(:hover,:focus-within) .slot-add{opacity:1;pointer-events:auto}}
.entry-grid .edge-active{outline:2px solid var(--ink);outline-offset:-3px}
body.resizing,body.resizing *{cursor:ns-resize!important;user-select:none}
.editor-op textarea[data-field=instructions]{font-size:13px;min-height:42px;text-align:center;margin-bottom:8px}
.entry-procedure-title textarea{font-size:16px;font-weight:700;text-align:center;min-height:32px}
.editor-op .component-list{text-align:left;font-size:10px;margin:5px 0 9px}
.editor-op .component-button{font-size:11px;padding:5px 6px;min-height:28px;background:rgba(255,255,255,.5)}
.procedure-details{border-top:1px solid #aebdab;margin-top:8px;text-align:left}
.timer-field{display:flex;align-items:center;gap:4px;margin:4px 0}.timer-field span{font-size:10px;color:var(--ink-soft)}
.editor-op .timer-field input{width:65px;font-size:12px;min-height:26px}
.editor-op .output-fields{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.output-fields input:first-child,.output-fields textarea{grid-column:span 2}
.editor-op .output-fields input,.editor-op .output-fields textarea{font-size:11px;min-height:27px;background:rgba(255,255,255,.4)}
.editor-op.empty-column{vertical-align:middle;padding:22px}
.editor-op.procedure-reference{vertical-align:middle;font-size:14px}.procedure-reference button{display:flex;font-size:10px;margin:10px auto 0}
.editor-ingredient.independent{vertical-align:middle;color:var(--ink-soft)}.independent small{font-size:11px}.independent p{font-size:14px;margin:4px 0;overflow-wrap:anywhere}
#credit-editor{margin-top:20px}#credit-editor textarea{width:100%;font:11.5px/1.6 'Space Mono',monospace;min-height:42px;border-color:#cbd4c6}
.section-top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:32px 0 12px}
.section-top h2{font:600 24px/1.2 'Bricolage Grotesque',sans-serif;letter-spacing:-.025em;margin:0}
.edit-table{min-width:890px;table-layout:fixed}.edit-table th{background:var(--turmeric);color:#fff;text-align:left;font-size:12px;font-weight:500;padding:8px 10px;border:1px solid var(--rule)}
.edit-table td{padding:6px;vertical-align:top}.edit-table input,.edit-table textarea{width:100%;border-color:transparent;padding:6px 4px;min-height:34px}
.edit-table input:hover,.edit-table textarea:hover{border-color:#adb6ab}.edit-table textarea{font-size:13px;min-height:64px}
.edit-table .row-actions{white-space:nowrap;text-align:center;padding:10px 2px;vertical-align:middle}
.row-actions button{font-size:11px;padding:4px 5px;min-height:0;border-color:transparent}.row-actions button:hover{border-color:var(--rule)}
.row-actions button[data-action^=remove]{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;margin-left:4px;padding:4px;color:#92372f;background:#fff0ed;border:1px solid #c98e86;vertical-align:middle}
@media (hover:hover) and (pointer:fine){
 .row-actions :is(button.drag-handle,button.add-parallel,button[data-action^=remove]){opacity:0;pointer-events:none;transition:opacity .12s ease}
 :is(.entry-grid td,.entry-grid th,.edit-table tr):is(:hover,:focus-within) .row-actions :is(button.drag-handle,button.add-parallel,button[data-action^=remove]){opacity:1;pointer-events:auto}
 :is(.entry-grid td,.entry-grid th,.edit-table tr):is(:hover,:focus-within) .row-actions :is(button.drag-handle,button.add-parallel,button[data-action^=remove]):disabled{opacity:.4;pointer-events:none}
}
.row-actions button.drag-handle{width:24px;height:24px;margin-left:3px;padding:4px;color:var(--ink);background:#fff;border:1px solid var(--ink);vertical-align:middle;cursor:grab;touch-action:none}
.row-actions button.drag-handle svg{display:block;width:14px;height:14px}
.row-actions button.drag-handle:hover{color:#fff;background:var(--ink)}
.row-actions button.add-parallel{width:24px;height:24px;margin-left:3px;padding:0;font:14px/1 'Space Mono',monospace;color:var(--ink);background:#fff;border:1px solid var(--ink);vertical-align:middle}
.row-actions button.add-parallel:hover{color:#fff;background:var(--ink)}
.drag-ghost{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;max-height:320px;overflow:hidden;background:#fff;opacity:.94;box-shadow:0 14px 32px rgba(0,0,0,.22);will-change:transform}
.drag-ghost table{width:100%;min-width:0!important;table-layout:fixed}
.drag-ghost td{width:100%}
.entry-grid .drag-source,.edit-table .drag-source{outline:2px dashed var(--ink);outline-offset:-3px;opacity:.45}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}
.row-actions button[data-action^=remove]:hover{color:#fff;background:#92372f;border-color:#92372f}
.row-actions button[data-action^=remove]:focus-visible{outline:2px solid #92372f;outline-offset:2px}
.row-actions button[data-action^=remove] svg{display:block;width:14px;height:14px}
.component-button{display:block;font:12px/1.35 'Instrument Sans',sans-serif;text-align:left;padding:6px 8px;width:100%;min-height:34px;border-color:#adb6ab}
.component-list{font-size:11px;line-height:1.4;color:var(--ink-soft);margin:5px 2px 0;overflow-wrap:anywhere}
.notes-editor{min-width:650px}
#recipe-card{background:#fff;padding:30px 0 0;min-width:0}
#recipe-card h1{overflow-wrap:anywhere}
#recipe-card .deck{white-space:pre-wrap;max-width:48ch}
#recipe-card table{min-width:360px;table-layout:fixed}
#recipe-card td.ing{overflow-wrap:anywhere}
#recipe-card .note,#recipe-card .prep,#recipe-card .finish{white-space:pre-line;overflow-wrap:anywhere}
#recipe-card td.op{overflow-wrap:anywhere;min-width:120px;white-space:pre-line}
#recipe-card td.op .output{font-size:11px;font-style:italic;border-top:1px solid rgba(27,34,28,.18);padding-top:6px;margin-top:8px}
#recipe-card td.gap{background:#fff;padding:0}
#recipe-card td.ing.preparation{color:var(--ink-soft);font-style:italic;cursor:default}
#recipe-card .notes{margin-top:32px}
#recipe-card .note-item p,#recipe-card .credit{white-space:pre-wrap;overflow-wrap:anywhere}
#recipe-card .ingredient-line,#recipe-card .detail-line{display:flex;gap:10px;align-items:baseline}
#recipe-card .q,#recipe-card .secondary-q{min-width:88px;flex-shrink:0}
#recipe-card .ingredient-line .name,#recipe-card .detail-line .note{min-width:0;flex:1}
#recipe-card .detail-line .secondary-q:empty{min-width:88px}
#recipe-card .meta{margin-bottom:24px}
#recipe-card.image-export h1{font-size:88px!important}
#recipe-card.image-export .deck{font-size:22px!important}
#recipe-card.image-export td.ing{font-size:16px!important}
#recipe-card td.op:focus-visible,#recipe-card td.ing:focus-visible{outline:3px solid var(--turmeric);outline-offset:-4px}
.empty-card{border:1px solid var(--rule);color:var(--ink-soft);padding:36px 20px;text-align:center;font-size:14px}
#preview-warnings{color:var(--ink-soft);font-size:12px;margin:0 0 14px;white-space:pre-line}
#preview .controls{margin-bottom:18px}[data-servings],.serving-input{width:42px}
.serving-input{height:var(--control-h);padding:0;text-align:center;font-size:13px;-moz-appearance:textfield;appearance:textfield}
.serving-input::-webkit-inner-spin-button,.serving-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.notice{min-height:20px;font-size:13px;color:var(--turmeric);margin:8px 0}.notice:empty{min-height:0;margin:0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;font-size:13px;max-width:calc(100vw - 32px);z-index:5}
dialog{border:1.5px solid var(--rule);padding:26px;max-width:540px;width:calc(100% - 32px);max-height:85vh;color:var(--ink);background:#fff}
dialog::backdrop{background:rgba(27,34,28,.3)}
dialog h2{font:600 26px/1.2 'Bricolage Grotesque',sans-serif;margin:0 0 8px}
dialog p{font-size:13px;color:var(--ink-soft);margin:0 0 20px}
.component-options{max-height:45vh;overflow-y:auto}.component-options h3{font:11px 'Space Mono',monospace;text-transform:uppercase;letter-spacing:.1em;margin:18px 0 8px;color:var(--turmeric)}
.component-option{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #dde3da;cursor:pointer;font-size:14px}
.component-option small{display:block;font-size:11px;color:var(--ink-soft);margin-top:2px}
.component-option.blocked{opacity:.45;cursor:not-allowed}
.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.dialog-actions .go{margin-left:0}
.export-options{display:grid;gap:10px}.export-options button{justify-content:flex-start;font-size:14px;padding:14px 16px}
.export-row{display:flex;gap:10px}.export-row>button:first-child{flex:1}
.export-options button.copy-image{justify-content:center;gap:8px;padding:14px 16px}.copy-image svg{width:18px;height:18px}
@media(max-width:680px){
 body{padding:20px 16px 40px}.app-top h1{font-size:32px}
 .view-bar{gap:12px}.view-bar .export-bar{margin-left:0;width:100%}.export-bar{gap:6px}.export-bar button{padding:0 12px}
 #save-status{width:100%;margin-left:0}.library-bar select{max-width:none}
 .entry-grid .item-title input,.entry-grid .prep textarea,.entry-grid .finish textarea{text-align:left}
 #recipe-card h1{font-size:44px}.clock{margin-left:0}#recipe-card td.ing{font-size:14px}.stage-bar{gap:10px}
}
@page{size:A4 landscape;margin:10mm}
@media print{
 .app-top,.library-bar,.view-bar,#editor,#preview-warnings,#toast,.notice,.controls,.stage-bar,dialog{display:none!important}
 #preview{display:block!important}#recipe-card{padding:0;width:100%!important}.wrap{max-width:none}
 #recipe-card .scroll{overflow:visible}#recipe-card table{width:100%!important;min-width:0!important}
 #recipe-card col{width:auto!important}#recipe-card col:first-child{width:34%!important}
 #recipe-card h1{font-size:44px}#recipe-card .deck{font-size:16px;max-width:none;margin-top:10px}
 #recipe-card .eyebrow{font-size:10px;margin-bottom:10px}#recipe-card .meta{margin-top:16px;margin-bottom:14px;padding-top:8px}
 #recipe-card td{padding:3px 6px;font-size:11px}#recipe-card td.op b{font-size:12px}#recipe-card td.op span{font-size:10px}
 #recipe-card .q,#recipe-card .name{font-size:11px}#recipe-card .q,#recipe-card .secondary-q{min-width:55px}
 #recipe-card .detail-line,#recipe-card .note{font-size:9px}.ingredient-line,.detail-line{gap:6px!important}
 #recipe-card td.op,#recipe-card td.prep,#recipe-card td.finish{print-color-adjust:exact;-webkit-print-color-adjust:exact}
 #recipe-card td.op{background:var(--kale-wash)}#recipe-card tr{break-inside:avoid}#recipe-card .scroll{break-inside:avoid}
 #recipe-card .notes{break-inside:avoid}#recipe-card .note-item p{font-size:12px}#recipe-card .note-item h3{font-size:14px}
 #recipe-card td.off{opacity:1;text-decoration:none}.dim td.op,.dim td.ing{opacity:1!important}
 #recipe-card td.op.hot{background:var(--kale-wash);color:var(--ink)}#recipe-card td.op.hot span{color:var(--ink)}
 #recipe-card tr.hot td.ing{background:#fff}.note-item{break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap">
<header class="app-top"><h1>Recipe builder</h1><button id="monochrome-toggle" aria-pressed="false" aria-label="Black and white recipe card" title="Switch the recipe card between colour and black and white"><span class="mono-icon" aria-hidden="true"></span></button></header>
<div class="library-bar">
<label for="saved-recipes">Saved recipes</label><select id="saved-recipes" aria-label="Saved recipes"></select>
<button id="new-recipe" class="icon-button" aria-label="New recipe" title="New recipe"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10 4v12M4 10h12"/></svg></button><button id="save-recipe" class="icon-button" aria-label="Save recipe" title="Save recipe"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4.75 3.75h8.5l3 3v9.5H4.75z"/><path d="M7.25 3.75v3.5h5v-3.5M7.25 16.25v-5h5.5v5"/></svg></button><button id="delete-recipe" class="icon-button" aria-label="Delete recipe" title="Delete recipe"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3.75 5.75h12.5M8.25 5.75v-2h3.5v2M5.75 5.75l.75 10.5h7l.75-10.5"/></svg></button><button id="duplicate-recipe" class="icon-button" aria-label="Duplicate recipe" title="Duplicate recipe"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="7.75" y="7.75" width="8.5" height="8.5"/><path d="M12.25 7.75v-4h-8.5v8.5h4"/></svg></button><button id="undo" class="icon-button" aria-label="Undo" title="Undo (Ctrl/⌘ Z)" disabled><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7.5 4.75 4.25 8l3.25 3.25M4.25 8h7.5a3.75 3.75 0 0 1 0 7.5H9"/></svg></button><button id="redo" class="icon-button" aria-label="Redo" title="Redo (Shift Ctrl/⌘ Z)" disabled><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12.5 4.75 15.75 8l-3.25 3.25M15.75 8h-7.5a3.75 3.75 0 0 0 0 7.5H11"/></svg></button>
<span id="save-status" role="status" aria-live="polite">Saving…</span>
</div>
<div class="view-bar">
<button id="edit-tab" aria-pressed="true">Edit table</button><button id="preview-tab" aria-pressed="false">Recipe card</button>
<div class="export-bar" aria-label="Export recipe">
<button id="export-html">Save HTML</button><button id="open-export" aria-haspopup="dialog" aria-controls="export-dialog">Export</button>
</div>
</div>
<div id="export-status" class="notice" role="status" aria-live="polite"></div>
<main>
<section id="editor" aria-label="Recipe editor">
<div class="entry-toolbar"><h2>Recipe table</h2><div><button class="text-tool fraction" data-insert="1/2" aria-label="Insert one half" title="Insert 1/2 at the cursor" disabled><span class="frac" aria-hidden="true"><span>1</span><span>2</span></span></button><button class="text-tool fraction" data-insert="1/4" aria-label="Insert one quarter" title="Insert 1/4 at the cursor" disabled><span class="frac" aria-hidden="true"><span>1</span><span>4</span></span></button><button class="text-tool fraction" data-insert="3/4" aria-label="Insert three quarters" title="Insert 3/4 at the cursor" disabled><span class="frac" aria-hidden="true"><span>3</span><span>4</span></span></button><button class="text-tool fraction" data-insert="1/3" aria-label="Insert one third" title="Insert 1/3 at the cursor" disabled><span class="frac" aria-hidden="true"><span>1</span><span>3</span></span></button><button class="text-tool fraction" data-insert="2/3" aria-label="Insert two thirds" title="Insert 2/3 at the cursor" disabled><span class="frac" aria-hidden="true"><span>2</span><span>3</span></span></button><button id="insert-degree" class="text-tool" data-insert="°" aria-label="Insert degree symbol" title="Insert ° at the cursor in the active text field" disabled>°</button><button data-action="add-ingredient" aria-label="Add ingredient">+ Ingredient</button><button data-action="add-step" aria-label="Add step">+ Step</button></div></div>
<div class="scroll" id="entry-table"></div>
<div id="credit-editor"></div>
<div class="section-top"><h2>Recipe notes</h2><button data-action="add-note">Add note</button></div>
<div id="note-editor"></div>
</section>
<section id="preview" aria-label="Recipe card preview" hidden>
<p id="preview-warnings"></p>
<div class="controls">
<div class="group"><span id="servings-label">Serves</span><button data-servings="2" aria-pressed="false">2</button><button data-servings="4" aria-pressed="true">4</button><button data-servings="6" aria-pressed="false">6</button><input class="serving-input" id="serving-value" type="number" min="0.01" max="10000" step="any" aria-label="Preview servings" value="4"><span id="servings-unit"></span></div>

<button class="go" id="start-cooking">Start cooking</button>
</div>
<div class="stage-bar" id="cooking-bar"><span class="stage-n" id="cooking-number"></span><span class="stage-t" id="cooking-title"></span><button id="previous-stage">Back</button><button id="next-stage">Next</button><button id="stop-cooking">Exit</button><span class="clock" id="cooking-clock"></span></div>
<article id="recipe-card"></article>
</section>
</main>
</div>
<dialog id="components-dialog" aria-labelledby="components-heading"><h2 id="components-heading">Components needed</h2><p id="components-description"></p><div class="component-options" id="component-options"></div><div class="dialog-actions"><button id="cancel-components">Cancel</button><button class="go" id="apply-components">Apply components</button></div></dialog>
<dialog id="export-dialog" aria-labelledby="export-heading"><h2 id="export-heading">Export recipe</h2><p>Choose a format for your recipe card.</p><div class="export-options"><button id="export-pdf">Print / PDF</button><button id="export-jpeg">HQ JPEG</button><div class="export-row"><button id="export-png">HQ PNG</button><button id="copy-png" class="copy-image" aria-label="Copy PNG image" title="Copy the image to paste elsewhere"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="7.75" y="7.75" width="8.5" height="8.5"/><path d="M12.25 7.75v-4h-8.5v8.5h4"/></svg>Copy</button></div></div><div class="dialog-actions"><button id="cancel-export">Cancel</button></div></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="/main.js"></script>
</body>
</html>
